name: Add daily CS paper

on:
  schedule:
    # Runs at 9:00 AM New York time during daylight saving time.
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-paper:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add a paper to the log
        run: python scripts/add_daily_paper.py

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No paper log changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add papers.md
          git commit -m "Add daily CS paper"
          git push
